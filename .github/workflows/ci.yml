name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -x bin/filesync commands/*.sh lib/*.sh scripts/ci-smoke-composer.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Composer validate
        run: composer validate --strict

      - name: Path-install smoke
        run: bash scripts/ci-smoke-composer.sh

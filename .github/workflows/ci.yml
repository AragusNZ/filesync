name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CI tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck dpkg-dev lintian

      - name: Shellcheck
        run: shellcheck -x bin/filesync commands/*.sh lib/*.sh scripts/ci-smoke-prefix.sh scripts/build-deb.sh

      - name: Prefix-install smoke
        run: bash scripts/ci-smoke-prefix.sh

      - name: Build .deb and lintian
        env:
          VERSION: 0.0.0-ci
        run: |
          bash scripts/build-deb.sh
          lintian --fail-on warning "filesync_${VERSION}_all.deb"
